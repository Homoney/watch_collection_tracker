name: Publish to Docker Hub

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Least privilege by default; the release job asks for write below.
permissions:
  contents: read

env:
  DOCKER_USERNAME: dhomoney  # Change this to your Docker Hub username
  IMAGE: watch-tracker

jobs:
  build-and-push:
    name: Build and Push the Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # create the GitHub release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            docker-compose.yml
            .env.example
          body: |
            ## Docker image

            `${{ env.DOCKER_USERNAME }}/${{ env.IMAGE }}:${{ github.ref_name }}` (amd64 and arm64)

            ## Quick start

            ```sh
            docker run -d --name watch-tracker --restart unless-stopped \
              -p 8080:8000 -v watch-data:/data \
              -e INITIAL_ADMIN_EMAIL=you@example.com \
              ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE }}:${{ github.ref_name }}
            ```

            Or download `docker-compose.yml` (and optionally `.env.example` as `.env`) and run `docker compose up -d`.

            See the [README](https://github.com/${{ github.repository }}) for settings, backups and upgrades.
