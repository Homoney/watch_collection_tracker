name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        # Tests use a temporary SQLite database (see tests/conftest.py)
        env:
          SECRET_KEY: test-secret-key-for-ci-0123456789abcdef
          UPLOAD_DIR: /tmp/test-uploads
          MAX_UPLOAD_SIZE: 20971520
        run: |
          cd backend
          mkdir -p /tmp/test-uploads
          pytest -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linter
        run: |
          cd frontend
          npm run lint

      - name: Run tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check Python dependencies
        continue-on-error: true
        run: |
          cd backend
          pip install pip-audit
          pip-audit -r requirements.txt --desc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check npm dependencies
        continue-on-error: true
        run: |
          cd frontend
          npm audit --audit-level=moderate

  single-image:
    name: Single Image Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Build the image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: watch-tracker:test
          cache-from: type=gha,scope=single-image
          cache-to: type=gha,mode=max,scope=single-image

      - name: Start the container
        run: |
          # No settings at all: the secret key is generated into the volume
          docker run -d --name wt -p 8080:8000 -v wt-data:/data watch-tracker:test
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://localhost:8080/health

      - name: Check the web app, API and headers
        run: |
          set -e
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/watches/any-page | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/v1/reference/brands | grep -q 'Rolex'
          curl -fsSI http://localhost:8080/ | grep -qi '^content-security-policy:'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/nope)
          test "$code" = "404"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/uploads/x/y.jpg)
          echo "Unsigned /uploads/ request returned $code"
          test "$code" = "403"

      - name: Check data folder, backup command and restart
        run: |
          set -e
          docker exec wt ls /data/watch.db /data/secret_key /data/uploads /data/backups
          docker exec wt python -m app.cli backup
          test "$(docker exec wt sh -c 'ls /data/backups | wc -l')" -ge 1
          key_before=$(docker exec wt cat /data/secret_key)
          docker restart wt
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://localhost:8080/health
          test "$(docker exec wt cat /data/secret_key)" = "$key_before"
          test "$(docker inspect -f '{{.Config.User}}' wt)" = "app"

      - name: Show logs on failure
        if: failure()
        run: docker logs wt

  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python linters
        run: |
          pip install black flake8 isort

      - name: Check Python code formatting
        run: |
          cd backend
          black --check app/
          isort --check-only app/
          flake8 app/ --max-line-length=120 --exclude=__pycache__,migrations

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Check TypeScript
        run: |
          cd frontend
          npm run build

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-scan, dependency-audit, single-image]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "Single Image: ${{ needs.single-image.result }}"

          if [[ "${{ needs.backend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.single-image.result }}" != "success" ]]; then
            echo "CI pipeline failed!"
            exit 1
          fi

          echo "CI pipeline passed!"
