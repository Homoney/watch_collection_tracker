user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 21M;  # Slightly more than MAX_UPLOAD_SIZE

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=account_limit:10m rate=10r/m;
    # Uploads: only POSTs count (an empty key is not limited)
    map $request_method $upload_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $upload_limit_key zone=upload_limit:10m rate=10r/m;

    # Behind a CDN or load balancer, rate limits must key on the real client.
    # Uncomment and set your proxy's address range:
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # Upstream servers
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

        # HTTP Strict Transport Security (when HTTPS enabled)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Permissions Policy
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Cross-domain policies
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        include /etc/nginx/locations.conf;
    }

    # HTTPS: put fullchain.pem and privkey.pem in nginx/ssl/, set server_name,
    # delete the HTTP server above and uncomment both blocks below (the second
    # one replaces it with a redirect to HTTPS).
    #
    # server {
    #     listen 443 ssl default_server;
    #     http2 on;
    #     server_name your-domain.example;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:10m;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #     add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;
    #     add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    #     add_header X-Permitted-Cross-Domain-Policies "none" always;
    #
    #     include /etc/nginx/locations.conf;
    # }
    #
    # server {
    #     listen 80 default_server;
    #     server_name _;
    #     location = /health { default_type text/plain; return 200 "healthy\n"; }
    #     location / { return 301 https://$host$request_uri; }
    # }
}
