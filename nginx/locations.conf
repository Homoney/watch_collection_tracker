# Location blocks shared by the HTTP and HTTPS servers (included in nginx.conf).

# Health check (must be before /api/)
location = /health {
    access_log off;
    default_type text/plain;
    return 200 "healthy\n";
}

# Auth endpoints with stricter rate limiting (must be before /api/)
location /api/v1/auth/login {
    limit_req zone=auth_limit burst=3 nodelay;

    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/v1/auth/register {
    limit_req zone=auth_limit burst=3 nodelay;

    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Password change and token refresh: tighter limit than general API
location ~ ^/api/v1/auth/(change-password|refresh)$ {
    limit_req zone=account_limit burst=5 nodelay;

    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# File uploads (images, service documents)
location ~ ^/api/v1/watches/[^/]+/(images|fetch-images|service-history/[^/]+/documents)$ {
    limit_req zone=upload_limit burst=10 nodelay;
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API endpoints (CORS is handled by the backend from ALLOWED_ORIGINS)
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Uploaded files: served only with a valid signed URL issued by the API
location /uploads/ {
    auth_request /_verify_upload;
    alias /usr/share/nginx/uploads/;
    # A location with its own add_header drops the server-level ones,
    # so the security headers are repeated here.
    add_header Cache-Control "private, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # No CSP here: it would stop browsers' built-in PDF viewer.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
}

location = /_verify_upload {
    internal;
    proxy_pass http://backend/api/v1/files/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}

# Frontend (catch-all, must be last)
location / {
    proxy_pass http://frontend/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
