# Watch Collection Tracker: one container, one data volume.
#
#   docker compose up -d
#
# Everything the app keeps (database, uploads, backups, generated secret key)
# lives in the watch-data volume. See README.md for the settings.
services:
  watch-tracker:
    image: dhomoney/watch-tracker:${VERSION:-latest}
    # To build from this checkout instead: docker compose up -d --build
    build: .
    container_name: watch-tracker
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8000"
    volumes:
      - watch-data:/data
    environment:
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      TZ: ${TZ:-UTC}
      # Optional; uncomment as needed:
      # SECRET_KEY: ${SECRET_KEY}          # default: generated into /data/secret_key
      # TRUSTED_PROXIES: 172.16.0.0/12     # your reverse proxy's address
      # BACKUP_KEEP_DAYS: 30
      # UPLOAD_URL_TTL_SECONDS: 3600
      # WATCHBASE_API_KEY: ${WATCHBASE_API_KEY}  # or set it on the Admin page

volumes:
  watch-data:
